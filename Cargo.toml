[package]
name = "system"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
cxx = "1.0"
cxx-qt = "0.9"
cxx-qt-lib = { version = "0.9", features = ["qt_gui", "qt_qml"] }
gfxinfo = "0.1"
sysinfo = "0.33"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"
wl-clipboard-rs = { version = "0.9.3", features = ["dlopen"] }
open-meteo-rs = "0.1.0"
notify-rust = "4"
rfd = "0.15"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
material-colors = { version = "0.4", features = ["image", "serde"] }
toml = "0.8"
regex = "1"
rayon = "1.10"
image = "0.25"

[build-dependencies]
cxx-qt-build = { version = "0.9", features = ["link_qt_object_files"] }
